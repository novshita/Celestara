[project]
name = "celestara-backend"
version = "0.1.0"
description = "Celestara backend - deterministic astrology calculation and AI interpretation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyswisseph>=2.10",
    "timezonefinder>=6.5",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
