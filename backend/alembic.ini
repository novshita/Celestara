# For the `alembic` command line, run from the backend/ directory:
#   alembic upgrade head
#   alembic revision --autogenerate -m "add a column"
# The application itself migrates on startup (app/db/migrate.py) and does
# not read this file; the database URL comes from DATABASE_URL either way.
[alembic]
script_location = app/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
