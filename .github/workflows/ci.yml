name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The lowest version pyproject.toml supports.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  # The same suite against Postgres, the spec's primary database (engineering
  # spec §18). SQLite hides a class of bugs - it drops timezones and is lenient
  # about types - so the server's clock is deliberately not UTC here: a time
  # written or compared naively would be off by 5h30 and fail.
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: celestara_test
          TZ: Asia/Kolkata
          PGTZ: Asia/Kolkata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: The whole suite on Postgres
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:pw@localhost:5432/celestara_test
      - name: The migrations apply to a fresh Postgres and match the models
        run: |
          PGPASSWORD=pw createdb -h localhost -U postgres celestara_migrations
          python -c "from app.db.migrate import upgrade_to_head; upgrade_to_head()"
          alembic check
        env:
          DATABASE_URL: postgresql+psycopg://postgres:pw@localhost:5432/celestara_migrations

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The journeys from engineering spec §31, plus accessibility, reduced motion
  # and small-screen checks, in a real browser against the real backend (with
  # the AI provider faked), the production frontend build and a throwaway
  # database.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and the browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the frontend
        working-directory: frontend
        run: npm run build
      - name: Run the browser tests
        working-directory: frontend
        run: npx playwright test
        env:
          E2E_PYTHON: python
      - name: Keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t celestara-backend backend
      - name: Backend image answers its health check
        run: |
          docker run -d --name api -p 8000:8000 celestara-backend
          for i in $(seq 1 20); do
            curl -fs http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
      - name: Build frontend image
        run: docker build -t celestara-frontend frontend
