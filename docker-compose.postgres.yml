# Production-style storage: the same app on PostgreSQL instead of SQLite.
#
#   POSTGRES_PASSWORD=choose-a-long-random-one \
#     docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build -d
#
# The password has no default on purpose: compose refuses to start without it.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: celestara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: celestara
    volumes:
      - celestara-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celestara -d celestara"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    environment:
      DATABASE_URL: postgresql+psycopg://celestara:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/celestara
    depends_on:
      db:
        condition: service_healthy

volumes:
  celestara-pg:
